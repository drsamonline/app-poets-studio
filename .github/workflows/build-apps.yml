# Build + release + deploy. One push, one pipeline, all from the same commit.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# This file is intentionally tiny: the whole pipeline lives in the public
# app-builder kit, so a fix there reaches every app at once. It used to be a
# 4.9 kB hand-copied workflow, and the copies drifted - one of them kept
# `if: always()` on the release job, which DELETED the published release before
# recreating it, so a failed build destroyed the release. Do not inline it again.
#
# What it does on every push to main:
#   build the portable EXE and the signed APK -> publish the rolling `app-latest`
#   release -> deploy the demo to Pages. All three come from the same commit, so
#   the live demo and the released build can never disagree.
#
# Pull requests build (and are therefore checked) but never release or deploy.

name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  app:
    uses: drsamonline/app-builder/.github/workflows/build.yml@0c12b67b888b9caa0aeaed61a7268dc9dfbb7660   # adaptive_icon input
    with:
      app_name: app-poets-studio
      app_src: docs/play
      deploy_path: docs
      # Android 8+ masks the launcher icon to the device's shape; this writes the
      # adaptive layers so the mark fills the mask instead of being letterboxed.
      adaptive_icon: true
    permissions:
      contents: write
      pages: write
      id-token: write

  announce:
    name: Give the release its face
    # The pipeline publishes the three builds and describes them in one sentence.
    # This rewrites that sentence into something a person can act on: the icon, a
    # table of builds, their sizes and their digests — read back from the release
    # that was just published, so the page cannot describe a build that is not there.
    needs: [app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - name: Rewrite the rolling release notes
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_TAG: app-latest
          APP_NAME: app-poets-studio
        run: bash scripts/release-notes.sh
