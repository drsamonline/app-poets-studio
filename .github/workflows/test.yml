# The proof. docs/play/poetry.js is what the app runs, so this tests the app.
name: Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: "20"
      - name: The engine, the dictionary and the forms
        run: node test-node.js
      - name: The page itself, in a real DOM
        # jsdom is a HARNESS dependency, installed here and never shipped: the app
        # itself still has none, which is the promise the deps badge makes.
        run: |
          npm install --no-audit --no-fund --no-save jsdom
          node test-ui.mjs
      - name: The app ships what it says it ships
        run: |
          set -euo pipefail
          for f in index.html poetry.js dict.js samples.js web-kit.js export-kit.js sw.js manifest.webmanifest; do
            test -s "docs/play/$f" || { echo "::error::docs/play/$f is missing or empty"; exit 1; }
          done
          node --check docs/play/poetry.js
          node --check docs/play/samples.js
          node --check docs/play/sw.js
          echo "docs/play is complete" >> "$GITHUB_STEP_SUMMARY"
